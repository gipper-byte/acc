<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセサリー成長シミュレーター</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f5f7fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background-color: #ffffff; border-bottom: 2px solid #3b82f6; padding: 15px 20px; }
        .header h1 { margin: 0; color: #3b82f6; font-size: 1.4rem; font-weight: bold; text-align: left; }
        
        /* 入力欄全体：横に5列並べる設定 */
        .input-section { padding: 15px 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; background: #fff; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        
        label { font-size: 0.75rem; font-weight: bold; color: #666; margin-bottom: 1px; }
        select, input { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; outline: none; box-sizing: border-box; width: 100%; transition: border-color 0.2s; }
        select:focus, input:focus { border-color: #3b82f6; }
        
        .info-bar { padding: 12px 20px; background-color: #fffaf0; border-top: 1px solid #fee2e2; color: #dc2626; font-weight: bold; font-size: 0.9rem; text-align: left; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background-color: #3b82f6; color: white; padding: 12px; font-size: 0.85rem; text-align: center; font-weight: bold; border-right: 1px solid rgba(255,255,255,0.2); }
        th:last-child { border-right: none; }
        td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: right; font-size: 0.9rem; white-space: nowrap; }
        .target-lv { text-align: left; font-weight: bold; color: #1e40af; padding-left: 20px; }
        .stat-val { color: #059669; font-weight: bold; text-align: center; }
        .achieved { color: #9ca3af !important; }
        .highlight-day { color: #ef4444; font-weight: bold; padding-right: 20px; }

        @media (max-width: 768px) {
            .input-section { grid-template-columns: 1fr 1fr; gap: 10px; }
            th, td { font-size: 0.75rem; padding: 8px 4px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>💍 アクセサリー成長シミュレーター</h1></div>
    
    <div class="input-section">
        <div class="field">
            <label>アクセサリーを選択</label>
            <select id="accSelect" onchange="loadAccData()"><option value="">-- 選択 --</option></select>
        </div>
        <div class="field"><label>現在のレベル</label><input type="number" id="currentLv" value="1" oninput="calculate()"></div>
        <div class="field"><label>初期経験値</label><input type="number" id="baseExp" value="100" oninput="calculate()"></div>
        <div class="field"><label>指輪の数(+10%×n)</label><input type="number" id="rings" value="0" oninput="calculate()"></div>
        <div class="field"><label>時給(ベース)</label><input type="number" id="hourlyExp" value="30000" oninput="calculate()"></div>
    </div>

    <div class="info-bar" id="infoLabel">時給(ボーナス込): 30,000 経験値 | 初期体力: -</div>

    <table>
        <thead>
            <tr>
                <th style="width: 15%;">目標Lv</th>
                <th style="width: 25%;">ステータス</th>
                <th style="width: 25%;">必要経験値(累計)</th>
                <th style="width: 20%;">残り時間</th>
                <th style="width: 15%;">残り日数</th>
            </tr>
        </thead>
        <tbody id="resultTable"></tbody>
    </table>
</div>

<script>
const accMaster = [
    { name: "命脈の科学式", exp: 100, stat: 155, type: "flat", label: "体力" },
    { name: "鼓動核", exp: 300, stat: 15, type: "percent", label: "体力" },
    { name: "ウィンドクレスト", exp: 100, stat: 135, type: "flat", label: "攻速" },
    { name: "閃月星", exp: 300, stat: 15, type: "percent", label: "攻速" },
    { name: "ブラッドトニック", exp: 100, stat: 90, type: "flat", label: "攻撃力" },
    { name: "力瓶", exp: 500, stat: 20, type: "percent", label: "攻撃力" },
    { name: "アークグリモワール", exp: 100, stat: 30, type: "flat", label: "魔力" },
    { name: "創胎珠", exp: 500, stat: 20, type: "percent", label: "魔力" },
    { name: "フォースモジュール", exp: 100, stat: 80, type: "flat", label: "防御" },
    { name: "騎士の心得", exp: 300, stat: 15, type: "percent", label: "防御" },
    { name: "迷盾陣", exp: 1000, stat: 50, type: "percent", label: "防御" },
    { name: "マギバインド", exp: 100, stat: 25, type: "percent", label: "魔防" },
    { name: "結界嵐", exp: 300, stat: 15, type: "percent", label: "魔防" },
    { name: "ヘキサスカル", exp: 1000, stat: 50, type: "percent", label: "魔防" },
    { name: "ラッキートランプ", exp: 100, stat: 99, type: "flat", label: "幸運" },
    { name: "運命眼", exp: 300, stat: 25, type: "percent", label: "幸運" },
    { name: "慈縛心", exp: 100, stat: 100, type: "flat", label: "回復" },
    { name: "メモリアルページ", exp: 100, stat: 30, type: "percent", label: "経験値" },
    { name: "賢者の盃", exp: 100, stat: 50, type: "percent", label: "経験値" },
    { name: "コンパス", exp: 100, stat: 100, type: "percent", label: "経験値" },
    { name: "知耀杯", exp: 1000, stat: 180, type: "percent", label: "経験値" },
    { name: "テイムマスク", exp: 100, stat: 30, type: "percent", label: "捕獲" },
    { name: "魅誘盃", exp: 100, stat: 50, type: "percent", label: "捕獲" },
    { name: "レター", exp: 100, stat: 80, type: "percent", label: "捕獲" },
    { name: "拘魂鎖", exp: 1000, stat: 100, type: "percent", label: "捕獲" },
    { name: "リング", exp: 100, stat: 30, type: "percent", label: "ドロップ" },
    { name: "収集機", exp: 1000, stat: 50, type: "percent", label: "ドロップ" }
];

const select = document.getElementById('accSelect');
accMaster.forEach((acc, i) => { select.innerHTML += `<option value="${i}">${acc.name}</option>`; });

let curStat = 0, curType = "", curLabel = "";

function loadAccData() {
    const acc = accMaster[select.value];
    if (!acc) return;
    document.getElementById('baseExp').value = acc.exp;
    curStat = acc.stat; curType = acc.type; curLabel = acc.label;
    calculate();
}

function calculate() {
    const bExp = parseFloat(document.getElementById('baseExp').value) || 0;
    const hExp = parseFloat(document.getElementById('hourlyExp').value) || 0;
    const rings = parseInt(document.getElementById('rings').value) || 0;
    const cLv = parseInt(document.getElementById('currentLv').value) || 1;
    const rate = hExp * (1 + (rings * 0.1));
    const unit = (curType === "percent") ? "%" : "";
    
    document.getElementById('infoLabel').innerText = `時給(ボーナス込): ${Math.floor(rate).toLocaleString()} 経験値 | 初期${curLabel}: ${curStat}${unit}`;

    const cTotal = (0.5 * cLv**2 - 5 * cLv) * bExp;
    const tbody = document.getElementById('resultTable');
    tbody.innerHTML = '';
    const gRate = (curType === "flat") ? 0.1 : 0.01;

    for (let lv = 100; lv <= 1000; lv += 100) {
        const tTotal = (0.5 * lv**2 - 5 * lv) * bExp;
        const diff = Math.max(0, tTotal - cTotal);
        const val = curStat * (1 + (lv - 1) * gRate);
        const hours = diff / rate;
        const isDone = lv <= cLv;
        const rowClass = isDone ? 'achieved' : '';

        tbody.innerHTML += `<tr>
            <td class="target-lv ${rowClass}">Lv ${lv}</td>
            <td class="stat-val ${rowClass}">${curLabel} ${val.toFixed(1)}${unit}</td>
            <td class="${rowClass}">${Math.floor(tTotal).toLocaleString()}</td>
            <td class="${rowClass}">${isDone ? "0.0" : hours.toFixed(1)} h</td>
            <td class="highlight-day ${rowClass}">${isDone ? "0.0" : (hours/24).toFixed(1)}日</td>
        </tr>`;
    }
}
</script>
</body>
</html>
